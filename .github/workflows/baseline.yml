name: WFM Baseline Validation

on:
  push:
    branches:
      - main
      - wfm-phase-a1-baseline
      - wfm-phase-2-auth-rbac
      - wfm-phase-2-dependency-hardening
      - wfm-phase-3-workorder-dispatch
      - wfm-phase-4-operations
      - wfm-phase-5c7-classification-retry
      - wfm-phase-5d-operational-readiness
      - wfm-phase-5e-sandbox-acceptance
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Phase 5C validation extends the authoritative live-operations baseline with integration execution, retry, classification, and database safety gates.

jobs:
  backend:
    name: Backend build and security validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wfm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d wfm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/wfm_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-fund
      - run: npm run prisma:generate
      - run: npx prisma validate
      - name: Apply production migrations to clean PostgreSQL
        run: npm run prisma:migrate:deploy
      - name: Run database-backed operational E2E
        run: npm run test:database-e2e
      - name: Run database-backed field exception lifecycle E2E
        run: npm run test:field-exception-database-e2e
      - run: npm run test:security
      - name: Run Phase 5C integration closure selftests
        run: npm run test:phase5c
      - name: Run Phase 5C integration database closure suite
        run: npm run test:phase5c-database
      - name: Run Phase 5D configuration preflight baseline
        run: npm run test:phase5d-config
      - name: Run Phase 5D mock provider connectivity contract
        run: npm run test:phase5d-sandbox
      - name: Run Phase 5D advanced mock provider faults
        run: npm run test:phase5d-faults
      - name: Run Phase 5D privacy-safe monitoring baseline
        run: npm run test:phase5d-monitoring
      - name: Run Phase 5D monitoring execution wiring
        run: npm run test:phase5d-monitoring-wiring
      - name: Run Phase 5D controlled activation safety
        run: npm run test:phase5d-activation
      - name: Run Phase 5D final release acceptance preflight
        run: npm run test:phase5d-release
      - name: Run Phase 5E mock provider acceptance
        run: npm run test:phase5e-provider
      - name: Run Phase 5E fleet control foundation selftest
        run: npm run test:phase5e-fleet-foundation
      - name: Run Phase 5E fleet stop reservation mock selftest
        run: npm run test:phase5e-fleet-stop
      - name: Run Phase 5E shared fleet wiring selftest
        run: npm run test:phase5e-fleet-wiring
      - name: Run Phase 5E isolated PostgreSQL stop admission race
        run: npm run test:phase5e-fleet-database
      - name: Run Phase 5E.2AB two-replica stop contract
        run: npm run test:phase5e-fleet-stop-contract-database
      - name: Run Phase 5E.2AC dispatch fencing adversarial contract
        run: npm run test:phase5e-dispatch-fence-contract
      - name: Run Phase 5E.2AD multi-replica worker quiescence contract
        run: npm run test:phase5e-worker-quiescence
      - name: Run Phase 5E.2AE isolated worker membership PostgreSQL E2E
        run: npm run test:phase5e-worker-membership-database
      - name: Run Phase 5E.2AF trusted worker identity PostgreSQL E2E
        run: npm run test:phase5e-trusted-worker-database
      - name: Run Phase 5E.2AG worker restart and identity race PostgreSQL E2E
        run: npm run test:phase5e-worker-restart-database
      - name: Run Phase 5E.2AH worker governance PostgreSQL E2E
        run: npm run test:phase5e-worker-governance-database
        env:
          WFM_SYNTHETIC_GOVERNANCE_FIXTURE: 'true'
      - name: Run Phase 5E.2AH governed roster mutation PostgreSQL E2E
        run: npm run test:phase5e-governed-worker-mutation-database
        env:
          WFM_SYNTHETIC_GOVERNANCE_FIXTURE: 'true'
      - name: Run Phase 5E.2AI payload-bound governance contract
        run: npm run test:phase5e-governance-payload
      - name: Run Phase 5E.2AI request correlation and credential inventory PostgreSQL E2E
        run: npm run test:phase5e-governance-request-database
        env:
          WFM_SYNTHETIC_GOVERNANCE_FIXTURE: 'true'
      - name: Run Phase 5E.2AJ trusted issuer negative security contract
        run: npm run test:phase5e-trusted-issuer
      - name: Run Phase 5E.2AK trusted issuer governance PostgreSQL E2E
        run: npm run test:phase5e-trusted-governance-database
      - name: Run Phase 5E.2AL actual worker SIGKILL durability PostgreSQL E2E
        run: npm run test:phase5e-worker-sigkill-database
      - name: Run Phase 5E.2AM adversarial two-replica dispatch fence
        run: npm run test:phase5e-multireplica-inflight-fence
      - name: Run Phase 5E.2AM in-flight SIGKILL PostgreSQL E2E
        run: npm run test:phase5e-inflight-sigkill-database
      - name: Run Phase 5E reconciliation quarantine regression
        run: npm run test:phase5e-reconciliation
      - name: Run Phase 5E drain status regression
        run: npm run test:phase5e-drain
      - name: Run Phase 5E strict stop safety regression
        run: npm run test:phase5e-stop-safety
      - name: Run Phase 5E controlled shutdown drain regression
        run: npm run test:phase5e-shutdown-drain
      - name: Run Phase 5E evidence-gated reconciliation audit regression
        run: npm run test:phase5e-reconciliation-audit
      - name: Run Phase 5E session approval ledger regression
        run: npm run test:phase5e-approval-ledger
      - name: Run Phase 5E authenticated approval boundary regression
        run: npm run test:phase5e-approval-boundary
      - name: Run Phase 5E mock receipt ingestion regression
        run: npm run test:phase5e-mock-receipt-ingestion
      - name: Run Phase 5E synthetic key lifecycle regression
        run: npm run test:phase5e-mock-key-lifecycle
      - name: Run Phase 5E isolated mock receipt database concurrency E2E
        run: npm run test:phase5e-mock-receipt-database
      - name: Run Phase 5E authenticated evidence attribution regression
        run: npm run test:phase5e-evidence-attribution
      - name: Run Phase 5E HTTP evidence and approval session boundary
        run: npm run test:phase5e-evidence-http-session
      - name: Run Phase 5E full synthetic reconciliation PostgreSQL E2E
        run: npm run test:phase5e-synthetic-reconciliation-database
      - name: Run Phase 5E authenticated approval HTTP fixture
        run: npm run test:phase5e-approval-http
      - name: Run Phase 5E isolated reconciliation database E2E
        run: npm run test:phase5e-reconciliation-database
      - run: npm run test:phase5e-external-dispatch-gate
      - run: npm run test:phase5e-production-issuer-readiness
      - name: Run Phase 5E.2AP synthetic send lockout security contract
        run: npm run test:phase5e-synthetic-send-lockout
      - name: Run Phase 5E.2AQ gateway transport policy negative tests
        run: npm run test:phase5e-gateway-transport-policy
      - name: Run Phase 5E.2AP synthetic external send boundary PostgreSQL E2E
        run: npm run test:phase5e-synthetic-send-gateway-database
        env:
          WFM_SHARED_GATEWAY_FIXTURE: 'true'
          WFM_SYNTHETIC_SEND_GATEWAY_FIXTURE: 'true'
      - name: Run Phase 5E.2AO shared gateway PostgreSQL race
        run: npm run test:phase5e-shared-gateway-database
        env:
          WFM_SHARED_GATEWAY_FIXTURE: 'true'
      - name: Run Phase 5E.2AO shared gateway SIGKILL recovery
        run: npm run test:phase5e-shared-gateway-sigkill-database
        env:
          WFM_SHARED_GATEWAY_FIXTURE: 'true'
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web build and auth contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-fund
      - run: npm run test:auth-contract
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile TypeScript validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-fund
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high || true
