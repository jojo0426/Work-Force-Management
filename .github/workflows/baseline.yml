name: WFM Baseline Validation

on:
  push:
    branches:
      - wfm-phase-a1-baseline
      - wfm-phase-2-auth-rbac
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and RBAC validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run prisma:generate
      - run: npm run test:rbac
      - run: npm run build

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  mobile:
    name: Mobile TypeScript validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
