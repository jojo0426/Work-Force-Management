name: WFM Baseline Validation

on:
  push:
    branches:
      - wfm-phase-a1-baseline
      - wfm-phase-2-auth-rbac
      - wfm-phase-2-dependency-hardening
      - wfm-phase-3-workorder-dispatch
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend build and security validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: wfm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d wfm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/wfm_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-fund
      - run: npm run prisma:generate
      - run: npx prisma validate
      - name: Apply production migrations to clean PostgreSQL
        run: npm run prisma:migrate:deploy
      - name: Run database-backed operational E2E
        run: npm run test:database-e2e
      - run: npm run test:security
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-fund
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile TypeScript validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-fund
      - run: npx tsc --noEmit
      # Expo SDK 50 currently brings vulnerable build/CLI transitive dependencies.
      # Keep the report visible without pretending a forced major Expo upgrade is safe.
      - run: npm audit --omit=dev --audit-level=high || true
